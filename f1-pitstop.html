<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pit Stop Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: url('background.jpg') no-repeat center center/cover;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      gap: 40px;
    }

    .game-container {
      flex: 2;
      text-align: center;
    }

    .car {
      margin: 20px auto;
      width: 400px;
      height: 200px;
      background: url('f1design.png') no-repeat center center/contain;
      position: relative;
    }

    .wheel {
      width: 60px;
      height: 60px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 50%;
      position: absolute;
      cursor: pointer;
    }

    .front-left { top: 20px; left: 50px; }
    .front-right { top: 20px; right: 50px; }
    .rear-left { bottom: 20px; left: 50px; }
    .rear-right { bottom: 20px; right: 50px; }

    .changed { background: limegreen; }

    #timer { font-size: 24px; margin: 20px 0; }
    #result { font-size: 20px; margin-top: 10px; }

    .leaderboard {
      flex: 1;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .leaderboard h2 { margin-bottom: 10px; }

    #playerName {
      margin-top: 10px;
      padding: 8px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      text-align: center;
      outline: none;
    }

    #startBtn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: red;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>🏎️ Pit Stop Challenge</h1>
    <input type="text" id="playerName" placeholder="Enter your name">
    <br>
    <button id="startBtn">Start Game</button>
    <p id="timer">Time: 0.000s</p>
    <div class="car">
      <div class="wheel front-left"></div>
      <div class="wheel front-right"></div>
      <div class="wheel rear-left"></div>
      <div class="wheel rear-right"></div>
    </div>
    <p id="result"></p>
  </div>

  <div class="leaderboard">
    <h2>🏆 Leaderboard</h2>
    <ol id="leaderboardList"></ol>
  </div>

  <script>
    let startTime = null;
    let wheelsChanged = 0;
    let playerName = "";
    let timerInterval;

    const wheels = document.querySelectorAll(".wheel");
    const timerDisplay = document.getElementById("timer");
    const result = document.getElementById("result");
    const leaderboardList = document.getElementById("leaderboardList");
    const startBtn = document.getElementById("startBtn");
    const playerNameInput = document.getElementById("playerName");

    // Load leaderboard from localStorage
    let leaderboard = JSON.parse(localStorage.getItem("leaderboard")) || [];
    renderLeaderboard();

    startBtn.addEventListener("click", () => {
      playerName = playerNameInput.value.trim();
      if (!playerName) {
        alert("Please enter your name before starting!");
        return;
      }
      resetGame();
    });

    function resetGame() {
      wheels.forEach(w => w.classList.remove("changed"));
      wheelsChanged = 0;
      startTime = null;
      result.textContent = "";
      timerDisplay.textContent = "Time: 0.000s";
      clearInterval(timerInterval);
    }

    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        let elapsed = (Date.now() - startTime) / 1000;
        timerDisplay.textContent = "Time: " + elapsed.toFixed(3) + "s";
      }, 10);
    }

    wheels.forEach(wheel => {
      wheel.addEventListener("click", () => {
        if (!playerName) return;
        if (!startTime) startTimer();
        if (!wheel.classList.contains("changed")) {
          wheel.classList.add("changed");
          wheelsChanged++;
          if (wheelsChanged === 4) {
            clearInterval(timerInterval);
            let finalTime = (Date.now() - startTime) / 1000;
            result.textContent = `✅ ${playerName}, you finished in ${finalTime.toFixed(3)}s!`;
            saveScore(playerName, finalTime);
          }
        }
      });
    });

    function saveScore(name, time) {
      leaderboard.push({ name, time });
      leaderboard.sort((a, b) => a.time - b.time); // fastest first
      leaderboard = leaderboard.slice(0, 10); // keep top 10
      localStorage.setItem("leaderboard", JSON.stringify(leaderboard));
      renderLeaderboard();
    }

    function renderLeaderboard() {
      leaderboardList.innerHTML = "";
      leaderboard.forEach(entry => {
        const li = document.createElement("li");
        li.textContent = `${entry.name} - ${entry.time.toFixed(3)}s`;
        leaderboardList.appendChild(li);
      });
    }
  </script>
</body>
</html>
